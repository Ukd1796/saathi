[project]
name = "saathi-platform"
version = "0.1.0"
description = "Saathi: the medical rep's memory on any phone. Multi-company backend for Bolna voice agents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "rapidfuzz>=3.10",
    "jellyfish>=1.1",
    "indic-transliteration>=2.3",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
